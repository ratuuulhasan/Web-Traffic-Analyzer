<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Traffic Analyzer{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .navbar-brand { font-weight: 700; }
        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📊 Traffic Analyzer</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="/websites/" class="btn btn-sm btn-outline-light me-2">My Websites</a>
                <span class="text-white me-3">Hi, {{ user.username }}</span>
                <a href="/accounts/profile/" class="btn btn-sm btn-outline-light me-2">Profile</a>
                <a href="/accounts/logout/" class="btn btn-sm btn-danger">Logout</a>
            {% else %}
                <a href="/accounts/login/" class="btn btn-sm btn-outline-light me-2">Login</a>
                <a href="/accounts/register/" class="btn btn-sm btn-primary">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
